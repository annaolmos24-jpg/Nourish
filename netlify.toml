# Static site — no build step required.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*.{js,css,svg}"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
